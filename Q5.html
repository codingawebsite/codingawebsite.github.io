<body>
    <div class="container">
        <h1>Quiz Questions #4</h1>
        <hr>

        <form id="quizForm">
    <fieldset>
        <legend>What is the tag that acts as a container for all other table elements?</legend>

        <input type="radio" id="th" name="tag" value="&lt;th&gt;">
        <label for="th">&lt;th&gt;</label><br>

        <input type="radio" id="table" name="tag" value="&lt;table&gt;">
        <label for="table">&lt;table&gt;</label><br>

        <input type="radio" id="tr" name="tag" value="tr">
        <label for="tr">&lt;tr&gt;</label>
    </fieldset>

    <button type="submit">Submit</button>
</form>

<div id="result"></div>

<hr>

<h3>Chapters</h3>
<ul>
    <li><a href="Ch6.html">Chapter 6: Tables</a></li>
    <li><a href="Ch5.html">Chapter 5: Images</a></li>
</ul>

<nav>
    <h5><a href="progress.html">Next Chapter &rarr;</a></h5>
</nav>

<!-- Sound files -->
<audio id="correctSound" src="assets/sounds/correct.mp3"></audio>
<audio id="incorrectSound" src="assets/sounds/incorrect.mp3"></audio>

<script>
    const form = document.getElementById('quizForm');
    const resultDiv = document.getElementById('result');
    const correctSound = document.getElementById('correctSound');
    const incorrectSound = document.getElementById('incorrectSound');

    form.addEventListener('submit', function (e) {
        e.preventDefault(); // Prevent page refresh

        const selected = document.querySelector('input[name="tag"]:checked');

        if (!selected) {
            resultDiv.textContent = "Please select an answer!";
            resultDiv.style.color = "orange";
            return;
        }

       if (selected.value === "<table>") {
    resultDiv.textContent = "Right ✅";
    resultDiv.style.color = "green";
    resultDiv.style.backgroundColor = "#e6ffe6";
    correctSound.currentTime = 0;
    correctSound.play();
} else {
    resultDiv.textContent = "Wrong ❌";
    resultDiv.style.color = "red";
    resultDiv.style.backgroundColor = "#ffe6e6";
    incorrectSound.currentTime = 0;
    incorrectSound.play();
}
    });
</script>
